AWSTemplateFormatVersion: '2010-09-09'
Description: >
  [Step 1 / China Account / cn-northwest-1 or cn-north-1]
  IAM Roles Anywhere Trust Anchor + Profile + Read-Only Role for the
  Global-region DevOps Agent MCP bridge to obtain short-lived credentials
  in the China partition.

  Default policy is ReadOnlyAccess. Anyone in possession of the client
  cert/key can read ANY resource metadata in the China account during
  the credential validity window. To enable write operations, override
  ManagedPolicyArn at deploy time (e.g. to PowerUserAccess or
  AdministratorAccess) AT YOUR OWN RISK and rotate the cert as a root
  credential.

  Deploy ONCE in the China account. Outputs (TrustAnchorArn / ProfileArn /
  RoleArn) feed into the Global-region bridge stack.

Parameters:
  CACertificateBody:
    Type: String
    Description: >
      PEM-encoded CA certificate body (the full content of ca.crt, including
      BEGIN/END lines). The MCP bridge EC2 will hold a client cert signed by
      this CA and use it to call rolesanywhere.<region>.amazonaws.com.cn.
    NoEcho: false
    MinLength: 100

  RoleNamePrefix:
    Type: String
    Default: devops-agent-cn-admin
    Description: Prefix for the IAM role name created in the China account.
    AllowedPattern: '[a-zA-Z0-9_-]{1,32}'

  SessionDurationSeconds:
    Type: Number
    Default: 3600
    MinValue: 900
    MaxValue: 43200
    Description: Duration of credentials issued via Roles Anywhere Profile.

  ManagedPolicyArn:
    Type: String
    Default: 'arn:aws-cn:iam::aws:policy/ReadOnlyAccess'
    Description: >
      Managed policy ARN attached to the role. Defaults to ReadOnlyAccess
      for safe demo / inspection use. Override to a wider policy (e.g.
      PowerUserAccess or AdministratorAccess) only if you understand the
      blast radius — anyone with the client cert + API Key gets that
      level of access in your China account.
    AllowedPattern: '^arn:aws-cn:iam::(aws|[0-9]+):policy/.+$'

Resources:
  ReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${RoleNamePrefix}-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: rolesanywhere.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:TagSession
              - sts:SetSourceIdentity
            Condition:
              StringEquals:
                'aws:PrincipalTag/x509Subject/CN': '*'  # Tighten in production via cert subject mapping
      ManagedPolicyArns:
        - !Ref ManagedPolicyArn
      Tags:
        - Key: Purpose
          Value: devops-agent-cn-bridge
        - Key: Access
          Value: full-access

  TrustAnchor:
    Type: AWS::RolesAnywhere::TrustAnchor
    Properties:
      Name: !Sub '${RoleNamePrefix}-trust-anchor'
      Source:
        SourceType: CERTIFICATE_BUNDLE
        SourceData:
          X509CertificateData: !Ref CACertificateBody
      Enabled: true
      Tags:
        - Key: Purpose
          Value: devops-agent-cn-bridge

  Profile:
    Type: AWS::RolesAnywhere::Profile
    Properties:
      Name: !Sub '${RoleNamePrefix}-profile'
      RoleArns:
        - !GetAtt ReadOnlyRole.Arn
      DurationSeconds: !Ref SessionDurationSeconds
      Enabled: true
      Tags:
        - Key: Purpose
          Value: devops-agent-cn-bridge

Outputs:
  TrustAnchorArn:
    Value: !GetAtt TrustAnchor.TrustAnchorArn
    Description: Trust Anchor ARN — pass to Step 2 stack as TrustAnchorArn parameter.
    Export:
      Name: !Sub '${AWS::StackName}-TrustAnchorArn'

  ProfileArn:
    Value: !GetAtt Profile.ProfileArn
    Description: Profile ARN — pass to Step 2 stack as ProfileArn parameter.
    Export:
      Name: !Sub '${AWS::StackName}-ProfileArn'

  RoleArn:
    Value: !GetAtt ReadOnlyRole.Arn
    Description: Admin Role ARN — pass to Step 2 stack as CnRoleArn parameter.
    Export:
      Name: !Sub '${AWS::StackName}-RoleArn'

  ChinaAccountId:
    Value: !Ref 'AWS::AccountId'

  ChinaRegion:
    Value: !Ref 'AWS::Region'
