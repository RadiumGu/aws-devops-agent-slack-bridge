AWSTemplateFormatVersion: '2010-09-09'
Description: >
  [Step 2 / Global Account] MCP bridge for AWS DevOps Agent to operate
  on aws-cn resources via Roles Anywhere using the managed policy from
  Step 1 (default: ReadOnlyAccess). Optionally hosts stdio-only awslabs
  MCP servers (cloudwatch / eks / ...) behind mcp-proxy.

  DevOps Agent -> CloudFront -> ALB (X-API-Key) -> EC2 running
  aws-api-mcp-server (:8000) + mcp-proxy (:8001) -> Roles Anywhere -> aws-cn.

  WARNING: scope = the managed policy from Step 1. X-API-Key + CloudFront
  reach gives that level of access. Lock AllowedAdminCidrs; rotate keys.

  Prerequisites: deploy 01-cn-roles-anywhere.yaml first; upload client
  cert/key to SSM SecureString /devops-agent-cn-bridge/client-cert and
  /client-key (or override below).

Parameters:
  # ---- Roles Anywhere references (from Step 1 outputs) ----
  TrustAnchorArn:
    Type: String
    Description: Trust Anchor ARN from the China-account stack (Step 1 output).
    AllowedPattern: '^arn:aws-cn:rolesanywhere:.+:trust-anchor/.+$'

  ProfileArn:
    Type: String
    Description: Profile ARN from the China-account stack (Step 1 output).
    AllowedPattern: '^arn:aws-cn:rolesanywhere:.+:profile/.+$'

  CnRoleArn:
    Type: String
    Description: ReadOnly Role ARN from the China-account stack (Step 1 output).
    AllowedPattern: '^arn:aws-cn:iam::[0-9]+:role/.+$'

  CnRegion:
    Type: String
    Default: cn-northwest-1
    AllowedValues:
      - cn-northwest-1
      - cn-north-1

  # ---- Client cert/key (SSM SecureString) ----
  ClientCertSsmName:
    Type: AWS::SSM::Parameter::Name
    Default: /devops-agent-cn-bridge/client-cert
    Description: SSM SecureString parameter name holding the PEM client cert.
  ClientKeySsmName:
    Type: AWS::SSM::Parameter::Name
    Default: /devops-agent-cn-bridge/client-key
    Description: SSM SecureString parameter name holding the PEM client key.

  # ---- Network ----
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
  SubnetACidr:
    Type: String
    Default: 10.20.1.0/24
  SubnetBCidr:
    Type: String
    Default: 10.20.2.0/24

  AllowedAdminCidrs:
    Type: CommaDelimitedList
    Default: ''
    Description: >
      Optional admin/test CIDRs allowed to hit the ALB directly on :80
      (bypassing CloudFront). Leave empty in production. The CloudFront
      origin-facing prefix list is always allowed when EnableCloudFront=true.

  EnableCloudFront:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Whether to put CloudFront in front of the ALB for HTTPS termination
      and to authorise the AWS-managed CloudFront origin-facing prefix list
      on the ALB SG. Set to 'false' if you plan to attach an ACM cert to
      the ALB directly (you then must populate AllowedAdminCidrs).

  # ---- EC2 ----
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues:
      - t3.small
      - t3.medium
      - t3.large
      - m5.large
    Description: >
      EC2 size. t3.medium (4GB) is the recommended floor when running the
      bundled multi-MCP setup (aws-api-mcp + mcp-proxy hosting cloudwatch /
      eks / cost-explorer). Drop to t3.small only if you disabled mcp-proxy
      via EnableMcpProxy=false.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  McpServerVersion:
    Type: String
    Default: 'latest'
    Description: >
      awslabs.aws-api-mcp-server version. Use 'latest' to always pull the
      newest release (recommended per requirement). Pin to a specific version
      (e.g. '0.2.5') if you need reproducible deployments.

  EnableMcpProxy:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Whether to also run mcp-proxy on :8001 to expose additional stdio-only
      awslabs MCP servers (cloudwatch / eks / cost-explorer / ...) under
      /servers/<name>/* paths. Set 'false' to keep only the original
      aws-api-mcp-server on :8000.

  McpProxyVersion:
    Type: String
    Default: '0.10.2'
    Description: >
      Pinned mcp-proxy (sparfenyuk/mcp-proxy) version. mcp-proxy is a
      community project; pin a known-good version rather than 'latest'.
      Override only after vetting newer releases.

  McpProxyServers:
    Type: String
    Default: 'cloudwatch,eks,cost-explorer'
    Description: >
      Comma-separated list of awslabs MCP server short names to host under
      mcp-proxy. Each name maps to a uvx package 'awslabs.<name>-mcp-server'
      at version 'latest' and is served at /servers/<name>/mcp. Pass an empty
      string '' to start mcp-proxy with no named servers (status endpoint
      still works). Examples: 'cloudwatch', 'cloudwatch,eks',
      'cloudwatch,eks,cost-explorer,prometheus'.
    AllowedPattern: '^([a-z0-9-]+(,[a-z0-9-]+)*)?$'

  AwsSigningHelperVersion:
    Type: String
    Default: '1.4.0'
    Description: aws_signing_helper version used by IAM Roles Anywhere.

Conditions:
  WithCloudFront: !Equals [!Ref EnableCloudFront, 'true']
  WithMcpProxy: !Equals [!Ref EnableMcpProxy, 'true']
  WithCloudFrontAndMcpProxy: !And
    - !Condition WithCloudFront
    - !Condition WithMcpProxy
  HasAdminCidr0: !Not [!Equals [!Join ['', !Ref AllowedAdminCidrs], '']]
  HasAdminCidr1: !And
    - !Condition HasAdminCidr0
    - !Not [!Equals [!Join [',', !Ref AllowedAdminCidrs], !Select [0, !Ref AllowedAdminCidrs]]]

Resources:
  # ===================== VPC =====================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-vpc'}]

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref SubnetACidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-public-a'}]

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref SubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-public-b'}]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  SubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # ===================== Security Groups =====================
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB SG - CloudFront origin-facing prefix list + optional admin CIDRs
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-alb-sg'}]

  # AWS-managed prefix list for CloudFront origin-facing IPs.
  # The prefix list ID is region-specific and not exposed via SSM public parameters,
  # so we look it up at deploy time with a tiny inline Lambda custom resource.
  CloudFrontPrefixListLookupRole:
    Type: AWS::IAM::Role
    Condition: WithCloudFront
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DescribePrefixList
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ec2:DescribeManagedPrefixLists
                Resource: '*'

  CloudFrontPrefixListLookupFn:
    Type: AWS::Lambda::Function
    Condition: WithCloudFront
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt CloudFrontPrefixListLookupRole.Arn
      Code:
        ZipFile: |
          import boto3, urllib.request, json
          def send(event, status, data):
              body = json.dumps({
                  'Status': status,
                  'Reason': data.get('Reason', 'see logs'),
                  'PhysicalResourceId': data.get('PhysicalResourceId', 'cf-pl'),
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data,
              }).encode()
              req = urllib.request.Request(event['ResponseURL'], data=body, method='PUT')
              req.add_header('Content-Type', '')
              urllib.request.urlopen(req).read()
          def handler(event, context):
              try:
                  if event['RequestType'] == 'Delete':
                      return send(event, 'SUCCESS', {})
                  ec2 = boto3.client('ec2')
                  resp = ec2.describe_managed_prefix_lists(
                      Filters=[{
                          'Name': 'prefix-list-name',
                          'Values': ['com.amazonaws.global.cloudfront.origin-facing'],
                      }],
                  )
                  pls = resp.get('PrefixLists', [])
                  if not pls:
                      return send(event, 'FAILED', {'Reason': 'CloudFront prefix list not found in this region'})
                  pl_id = pls[0]['PrefixListId']
                  send(event, 'SUCCESS', {'PrefixListId': pl_id, 'PhysicalResourceId': pl_id})
              except Exception as e:
                  send(event, 'FAILED', {'Reason': str(e)})

  CloudFrontPrefixList:
    Type: AWS::CloudFormation::CustomResource
    Condition: WithCloudFront
    Properties:
      ServiceToken: !GetAtt CloudFrontPrefixListLookupFn.Arn

  CloudFrontIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: WithCloudFront
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourcePrefixListId: !GetAtt CloudFrontPrefixList.PrefixListId
      Description: CloudFront origin-facing prefix list (com.amazonaws.global.cloudfront.origin-facing)

  ALBAdminIngress0:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasAdminCidr0
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: !Select [0, !Ref AllowedAdminCidrs]
      Description: Admin/test CIDR 0

  ALBAdminIngress1:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasAdminCidr1
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: !Select [1, !Ref AllowedAdminCidrs]
      Description: Admin/test CIDR 1

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EC2 SG - ALB access only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8001
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: MCP Server (8000 aws-api, 8001 mcp-proxy) from ALB only
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-ec2-sg'}]

  # ===================== Secrets Manager (ALB API Key) =====================
  ApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/alb-api-key'
      Description: >
        API key for X-API-Key header authentication on the ALB.
        NOTE: rotation requires CloudFormation update because the value is
        embedded into the ListenerRule via a static {{resolve:...}} reference.
      GenerateSecretString:
        ExcludePunctuation: true
        PasswordLength: 48

  # ===================== ALB =====================
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: VPCGatewayAttachment
    Properties:
      Name: !Sub '${AWS::StackName}-alb'
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref ALBSecurityGroup

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${AWS::StackName}-tg'
      Port: 8000
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: instance
      HealthCheckPath: /mcp
      HealthCheckProtocol: HTTP
      HealthCheckPort: '8000'
      Matcher:
        # 406 = MCP server is up but rejects plain GET (no MCP handshake).
        # This only proves the HTTP layer is alive, NOT end-to-end China call success.
        HttpCode: '406'
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Targets:
        - Id: !Ref EC2Instance
          Port: 8000

  HTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '403'
            ContentType: text/plain
            MessageBody: Forbidden

  ApiKeyListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HTTPListener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-API-Key
            Values:
              - !Sub '{{resolve:secretsmanager:${AWS::StackName}/alb-api-key}}'
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /mcp
              - /mcp/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ===================== mcp-proxy (multi-MCP gateway, optional) =====================
  # mcp-proxy hosts multiple stdio-only awslabs MCP servers behind one HTTP
  # endpoint, exposing each as /servers/<name>/mcp. Most awslabs MCP servers
  # (cloudwatch, eks, cost-explorer, ...) hardcode `mcp.run()` (stdio) and
  # cannot listen HTTP themselves; this is the standard bridge for that.
  McpProxyTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: WithMcpProxy
    Properties:
      Name: !Sub '${AWS::StackName}-proxy-tg'
      Port: 8001
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: instance
      HealthCheckPath: /status
      HealthCheckProtocol: HTTP
      HealthCheckPort: '8001'
      Matcher:
        # mcp-proxy /status returns 200 when the proxy is running.
        # Note: this DOES NOT validate that any individual named server
        # (cloudwatch / eks / ...) can actually spawn its uvx subprocess.
        HttpCode: '200'
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Targets:
        - Id: !Ref EC2Instance
          Port: 8001

  McpProxyListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: WithMcpProxy
    Properties:
      ListenerArn: !Ref HTTPListener
      Priority: 10
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-API-Key
            Values:
              - !Sub '{{resolve:secretsmanager:${AWS::StackName}/alb-api-key}}'
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /servers/*
              - /status
      Actions:
        - Type: forward
          TargetGroupArn: !Ref McpProxyTargetGroup

  # ===================== CloudFront (optional) =====================
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: WithCloudFront
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: HTTPS frontend for MCP Bridge ALB
        Origins:
          - Id: ALBOrigin
            DomainName: !GetAtt ApplicationLoadBalancer.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: ALBOrigin
          ViewerProtocolPolicy: https-only
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad           # CachingDisabled
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3   # AllViewer
        PriceClass: PriceClass_100

  # ===================== IAM Role for EC2 =====================
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: BridgeRuntime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadClientCertFromSsm
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ClientCertSsmName}'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ClientKeySsmName}'
              - Sid: DecryptSsmSecureString
                Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub 'arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*'
                Condition:
                  StringEquals:
                    'kms:ViaService': !Sub 'ssm.${AWS::Region}.amazonaws.com'

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref EC2Role]

  # ===================== EC2 Instance =====================
  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref PublicSubnetA
      SecurityGroupIds: [!Ref EC2SecurityGroup]
      IamInstanceProfile: !Ref EC2InstanceProfile
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-server'}]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -ex
          exec > /var/log/userdata.log 2>&1

          # ---- Dependencies ----
          dnf install -y python3.11 python3.11-pip unzip jq

          # ---- Install uv (Python package manager) ----
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="/root/.local/bin:$PATH"

          # ---- Install AWS Signing Helper for IAM Roles Anywhere ----
          curl -Lo /tmp/aws_signing_helper \
            "https://rolesanywhere.amazonaws.com/releases/${AwsSigningHelperVersion}/X86_64/Linux/aws_signing_helper"
          chmod +x /tmp/aws_signing_helper
          mv /tmp/aws_signing_helper /usr/local/bin/aws_signing_helper

          # ---- Pull client cert/key from SSM SecureString ----
          mkdir -p /opt/mcp-bridge/certs
          chmod 700 /opt/mcp-bridge/certs

          aws ssm get-parameter \
            --name "${ClientCertSsmName}" \
            --with-decryption \
            --region "${AWS::Region}" \
            --query 'Parameter.Value' --output text > /opt/mcp-bridge/certs/client.crt
          aws ssm get-parameter \
            --name "${ClientKeySsmName}" \
            --with-decryption \
            --region "${AWS::Region}" \
            --query 'Parameter.Value' --output text > /opt/mcp-bridge/certs/client.key
          chmod 600 /opt/mcp-bridge/certs/client.key
          chmod 644 /opt/mcp-bridge/certs/client.crt

          # ---- AWS CLI profile pointing at China region via Roles Anywhere ----
          mkdir -p /home/ec2-user/.aws
          cat > /home/ec2-user/.aws/config << EOF
          [profile china-readonly]
          region = ${CnRegion}
          credential_process = /usr/local/bin/aws_signing_helper credential-process \
              --certificate /opt/mcp-bridge/certs/client.crt \
              --private-key /opt/mcp-bridge/certs/client.key \
              --trust-anchor-arn ${TrustAnchorArn} \
              --profile-arn ${ProfileArn} \
              --role-arn ${CnRoleArn} \
              --endpoint https://rolesanywhere.${CnRegion}.amazonaws.com.cn \
              --region ${CnRegion}
          EOF
          chown -R ec2-user:ec2-user /home/ec2-user/.aws

          # ---- systemd service (pinned MCP server version, ALB-restricted Host header) ----
          ALB_DNS="${ApplicationLoadBalancer.DNSName}"
          cat > /etc/systemd/system/mcp-cn-bridge.service << SERVICEEOF
          [Unit]
          Description=AWS API MCP Server (China Region Read-Only Bridge)
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=root
          Environment="HOME=/home/ec2-user"
          Environment="PATH=/root/.local/bin:/usr/local/bin:/usr/bin:/bin"
          Environment="AWS_API_MCP_TRANSPORT=streamable-http"
          Environment="AWS_API_MCP_HOST=0.0.0.0"
          Environment="AWS_API_MCP_PORT=8000"
          Environment="AWS_API_MCP_ALLOWED_HOSTS=$ALB_DNS"
          Environment="AWS_API_MCP_PROFILE_NAME=china-readonly"
          Environment="AUTH_TYPE=no-auth"
          Environment="AWS_CONFIG_FILE=/home/ec2-user/.aws/config"
          ExecStart=/root/.local/bin/uvx awslabs.aws-api-mcp-server@${McpServerVersion}
          Restart=on-failure
          RestartSec=5
          StandardOutput=append:/var/log/mcp-cn-bridge.log
          StandardError=append:/var/log/mcp-cn-bridge.log

          [Install]
          WantedBy=multi-user.target
          SERVICEEOF

          systemctl daemon-reload
          systemctl enable mcp-cn-bridge
          systemctl start mcp-cn-bridge

          # ---- mcp-proxy: HTTP gateway for stdio-only awslabs MCP servers ----
          # Generates /opt/mcp-bridge/mcp-proxy-servers.json from the
          # CFN McpProxyServers parameter (a comma-separated string), then
          # runs mcp-proxy on :8001. Each server name <NAME> resolves to
          # package awslabs.<NAME>-mcp-server at version 'latest' and is
          # served at /servers/<NAME>/mcp.
          # In CFN Sub: dollar-brace-var = CFN substitution; dollar-brace-bang-var = literal $var for bash.
          if [ "${EnableMcpProxy}" = "true" ]; then
            dnf install -y jq || yum install -y jq

            MCP_NAMES="${McpProxyServers}"
            CN_REGION="${CnRegion}"
            JSON='{"mcpServers":{}}'
            # Build JSON by piping each name through jq.
            # ${!FOO} escapes from CFN !Sub so bash sees $FOO.
            for name in $(echo "${!MCP_NAMES}" | tr ',' ' '); do
              name_trimmed=$(echo "${!name}" | tr -d '[:space:]')
              [ -z "${!name_trimmed}" ] && continue
              JSON=$(echo "${!JSON}" | jq --arg n "${!name_trimmed}" --arg region "${!CN_REGION}" '
                .mcpServers[$n] = {
                  command: "/root/.local/bin/uvx",
                  args: ["awslabs.\($n)-mcp-server@latest"],
                  env: {
                    AWS_PROFILE: "china-readonly",
                    AWS_REGION: $region,
                    AWS_CONFIG_FILE: "/home/ec2-user/.aws/config",
                    FASTMCP_LOG_LEVEL: "INFO"
                  }
                }')
            done
            echo "${!JSON}" | jq . > /opt/mcp-bridge/mcp-proxy-servers.json

            cat > /etc/systemd/system/mcp-proxy.service << PROXYEOF
          [Unit]
          Description=mcp-proxy - HTTP gateway for stdio MCP servers
          After=network-online.target mcp-cn-bridge.service
          Wants=network-online.target

          [Service]
          Type=simple
          User=root
          Environment="HOME=/home/ec2-user"
          Environment="PATH=/root/.local/bin:/usr/local/bin:/usr/bin:/bin"
          Environment="AWS_CONFIG_FILE=/home/ec2-user/.aws/config"
          ExecStart=/root/.local/bin/uvx mcp-proxy@${McpProxyVersion} \
              --port 8001 \
              --host 0.0.0.0 \
              --pass-environment \
              --named-server-config /opt/mcp-bridge/mcp-proxy-servers.json
          Restart=on-failure
          RestartSec=5
          StandardOutput=append:/var/log/mcp-proxy.log
          StandardError=append:/var/log/mcp-proxy.log

          [Install]
          WantedBy=multi-user.target
          PROXYEOF

            systemctl daemon-reload
            systemctl enable mcp-proxy
            systemctl start mcp-proxy
          fi

Outputs:
  AlbDnsName:
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Description: ALB DNS name (HTTP only — for direct testing).

  McpEndpointHttp:
    Value: !Sub 'http://${ApplicationLoadBalancer.DNSName}/mcp'
    Description: Direct ALB MCP endpoint (testing).

  McpEndpointHttps:
    Condition: WithCloudFront
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}/mcp'
    Description: HTTPS MCP endpoint via CloudFront — register this with the DevOps Agent.

  McpProxyEndpointHttp:
    Condition: WithMcpProxy
    Value: !Sub 'http://${ApplicationLoadBalancer.DNSName}/servers/'
    Description: >
      Base URL for mcp-proxy named servers. Append <name>/mcp where <name>
      is one of McpProxyServers (e.g. cloudwatch, eks). Direct ALB — testing only.

  McpProxyEndpointHttps:
    Condition: WithCloudFrontAndMcpProxy
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}/servers/'
    Description: >
      HTTPS base URL for mcp-proxy named servers via CloudFront. Append
      <name>/mcp (e.g. /servers/cloudwatch/mcp) when registering with DevOps Agent.
      Only emitted when both EnableCloudFront=true and EnableMcpProxy=true.

  McpProxyStatusEndpoint:
    Condition: WithMcpProxy
    Value: !Sub 'http://${ApplicationLoadBalancer.DNSName}/status'
    Description: >
      mcp-proxy /status endpoint (requires X-API-Key header). Returns 200 +
      list of named servers. Use for smoke checks; does NOT validate that
      individual stdio subprocesses can actually spawn.

  ApiKeySecretArn:
    Value: !Ref ApiKeySecret
    Description: >
      Secrets Manager ARN holding the X-API-Key value.
      Read it with: aws secretsmanager get-secret-value --secret-id <arn>

  Ec2InstanceId:
    Value: !Ref EC2Instance
